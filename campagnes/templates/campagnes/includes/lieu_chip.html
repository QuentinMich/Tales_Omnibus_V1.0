{% load wagtailcore_tags %}
{# Pastille d'un lieu, à SA couleur (sinon celle de sa catégorie).        #}
{# Usage : {% include "campagnes/includes/lieu_chip.html" with lieu=... %} #}
<a href="{% pageurl lieu %}" class="lieu-chip"{% if lieu.couleur_effective %} style="--marker-color: {{ lieu.couleur_effective }};"{% endif %}>
    {{ lieu.title }}{% if lieu.categorie %} <small>({{ lieu.categorie.nom }})</small>{% endif %}
</a>
